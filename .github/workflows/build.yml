# Build, test, and the checks that keep this repository honest about itself.
#
# See ADR 0016. Everything here either blocks a merge or is not checked — a
# warning that does not fail is a warning that accumulates until nobody can tell
# which ones are new.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest run per branch matters. A queue of superseded runs on a busy
# branch costs minutes and tells nobody anything.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Read from global.json rather than pinned here, so the SDK version
          # lives in one place and a local build cannot silently differ from CI.
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Audits the whole dependency graph, not just direct references — most
      # vulnerabilities arrive transitively. Warnings are errors, so a newly
      # published advisory against anything in the graph turns the build red.
      - name: Audit dependencies
        run: dotnet list package --vulnerable --include-transitive

      # Separate from the audit and not fatal. A deprecated package is a thing to
      # plan for, not a reason to block a merge today.
      - name: Report deprecated packages
        continue-on-error: true
        run: dotnet list package --deprecated --include-transitive

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The rules ADR 0009 states and .editorconfig cannot express.
      - name: Check style rules
        run: bash build/check-style.sh

      # No committed settings file may carry a secret value.
      - name: Check configuration
        run: bash build/check-config.sh

      # Including the integration tests. Docker is available on GitHub-hosted
      # Linux runners, so Testcontainers starts a real PostgreSQL — a pipeline
      # that skips the tests needing infrastructure skips the tests that find
      # things (ADR 0010).
      - name: Test
        run: dotnet test --no-build --configuration Release

  # The schema is checked separately, because a migration that does not apply is
  # a different failure from a test that does not pass, and finding out at deploy
  # time is the expensive way.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Explicit, because dotnet ef reads the project's metadata before it builds
      # anything, and that read needs the assets file a restore produces. The
      # first run on GitHub failed here with NETSDK1004 for exactly that reason.
      - name: Restore
        run: dotnet restore src/Relay.Infrastructure

      - name: Install EF tooling
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      # Applied against a throwaway database, exactly as the deployment step
      # does it (ADR 0015). This is what turns "the migration compiles" into "the
      # migration runs".
      - name: Apply migrations
        env:
          ConnectionStrings__Relay: Host=localhost;Database=relay;Username=relay;Password=relay
        run: |
          dotnet ef database update \
            --project src/Relay.Infrastructure \
            --connection "$ConnectionStrings__Relay"

      # A model that has drifted from its migrations produces a schema no
      # migration path can reach — and the symptom appears on the next deploy, in
      # an environment with data in it.
      # Exits non-zero when the model has changes no migration captures. Run
      # `dotnet ef migrations add <Name>` to fix it.
      - name: Check for un-migrated model changes
        run: dotnet ef migrations has-pending-model-changes --project src/Relay.Infrastructure

  # The images have to build, and the compose stack has to come up, because both
  # are things the README tells a reader to do.
  containers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      # Started without --wait, then polled.
      #
      # --wait treats the one-shot migrate service inconsistently across Compose
      # versions — it runs to completion and exits, which is correct, and can be
      # read as a container that died. Polling the endpoint the smoke test is
      # about to use answers the only question that matters anyway.
      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the API
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:5080/health/live >/dev/null; then
              echo "API is live after ${attempt}s."
              exit 0
            fi
            sleep 1
          done

          echo "The API never became live."
          exit 1

      # A message submitted here goes through the worker, the fake upstream, and
      # a signed callback before it reads Delivered. If any of that is broken the
      # README's first instruction is wrong.
      - name: Deliver a message end to end
        run: |
          set -euo pipefail

          id=$(curl -sS -X POST http://localhost:5080/api/v1/messages \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -d '{"channel":"Email","recipient":"ci@example.com","body":"CI smoke test.","subject":"CI"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          echo "Submitted $id"

          for attempt in $(seq 1 30); do
            status=$(curl -sS "http://localhost:5080/api/v1/messages/$id" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')

            echo "  $attempt: $status"

            if [ "$status" = "Delivered" ]; then
              exit 0
            fi

            sleep 2
          done

          echo "The message never reached Delivered."
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
